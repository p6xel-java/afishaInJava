<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Электронный билет · Афиша</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><div class="shell nav"><a class="brand" href="/">✳ афиша<span class="brand-dot">.</span></a></div></header><main class="shell detail-page"><section class="detail-panel"><span class="eyebrow text-violet">ЭЛЕКТРОННЫЙ БИЛЕТ</span><h1>Твой билет</h1><p id="ticketState">Проверяем билет…</p><div id="ticketData" class="ticket-info" hidden></div><a class="btn btn-accent" href="/">Все события ↗</a></section></main><script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    (async()=>{const token=new URLSearchParams(location.search).get('token');const state=document.getElementById('ticketState'),data=document.getElementById('ticketData');if(!token||!/^[-_A-Za-z0-9]{43}$/.test(token)){state.textContent='Неверная ссылка на билет.';return}try{const r=await fetch('/api/v1/tickets/'+encodeURIComponent(token));if(!r.ok)throw Error(r.status===404?'Билет не найден или ещё не активирован.':'Не удалось получить билет.');const t=await r.json();state.textContent='Билет подтверждён. Покажите QR-код из письма при входе.';const dt=t.event?.startDateTime?new Date(t.event.startDateTime).toLocaleString('ru-RU'): 'Уточняется';data.hidden=false;data.innerHTML=`<p><strong>Номер билета:</strong> ${esc(t.ticketId)}</p><p><strong>Статус:</strong> ${esc(t.status)}</p><p><strong>Мероприятие:</strong> ${esc(t.event?.title)}</p><p><strong>Место:</strong> ${esc(t.event?.venue)}</p><p><strong>Дата:</strong> ${esc(dt)}</p>`}catch(e){state.textContent=e.message}})();
</script></body></html>
